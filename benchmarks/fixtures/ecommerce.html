<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Local E-Commerce Fixture</title>
</head>
<body>
  <header>
    <h1>Store Catalog</h1>
    <nav>
      <a href="/cart">Shopping Cart (0)</a>
      <a href="/login">Sign In</a>
    </nav>
  </header>
  <main>
    <section>
      <label for="search-box">Search Products</label>
      <input id="search-box" type="search" placeholder="Search laptops, phones...">
      <button id="search-btn" type="submit">Search</button>
    </section>
    <section id="results">
      <article>
        <h2>Pro Laptop 16</h2>
        <p>High performance developer laptop</p>
        <button class="add-to-cart">Add to Cart</button>
      </article>
    </section>
  </main>
</body>
</html>
