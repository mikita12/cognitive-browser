<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Travel Connection Search</title>
</head>
<body>
  <div id="consent-modal" style="display:none;">
    <p>Cookie settings</p>
    <button id="accept-all">Accept all</button>
  </div>
  <main>
    <h2>Book Train Tickets</h2>
    <form>
      <label for="from-station">Departure station</label>
      <input id="from-station" type="text" placeholder="From...">

      <label for="to-station">Destination station</label>
      <input id="to-station" type="text" placeholder="To...">

      <button id="search-connections" type="submit">Search connections</button>
    </form>
  </main>
</body>
</html>
