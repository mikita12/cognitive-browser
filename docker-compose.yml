services:
  cognitive-browser:
    build:
      context: .
      dockerfile: Dockerfile
    image: cognitive-browser:latest
    container_name: cognitive-browser
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEVICE=cuda
      - PORT=8000
      - MODEL_NAME=cross-encoder/nli-deberta-v3-small
      - SESSION_DIR=/data/browser_sessions
    volumes:
      - ./data/browser_sessions:/data/browser_sessions
      - /home/mikita/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
