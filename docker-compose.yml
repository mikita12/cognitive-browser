services:
  cognitive-browser:
    build:
      context: .
      dockerfile: Dockerfile
    image: cognitive-browser:latest
    container_name: cognitive-browser
    restart: unless-stopped
    ports:
      # Secure default: bind strictly to loopback interface. Do NOT expose to 0.0.0.0 without API_TOKEN.
      - "127.0.0.1:8000:8000"
    environment:
      - COGNITIVE_BROWSER_DEVICE=cuda
      - PORT=8000
      - COGNITIVE_BROWSER_MODEL=cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      - SESSION_DIR=/data/browser_sessions
      # Optional: uncomment to secure endpoints with bearer token authentication
      # - API_TOKEN=your-secret-token-here
    volumes:
      - ./data/browser_sessions:/data/browser_sessions
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
