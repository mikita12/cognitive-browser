name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint and format check (ruff)
      run: |
        ruff check cognitive_browser tests
        ruff format --check cognitive_browser tests

    - name: Type check (mypy)
      run: |
        mypy cognitive_browser tests

    - name: Run unit tests with coverage (pytest)
      run: |
        pytest --cov=cognitive_browser --cov-report=term-missing
