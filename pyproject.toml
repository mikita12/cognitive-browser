[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-browser"
version = "0.1.0"
description = "Universal Autonomous Browser Agent with Reflex Core (DeBERTa-v3 NLI) Decision Routing & Cortex Escalation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mikita" }
]
keywords = [
    "browser-agent",
    "mcp",
    "deberta",
    "playwright",
    "nli",
    "autonomous-agents",
    "aria",
    "decision-router",
    "zero-token"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "playwright>=1.40.0",
    "transformers>=4.40.0",
    "torch>=2.2.0",
    "pydantic>=2.6.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "requests>=2.31.0",
    "mcp>=1.2.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/mikita12/cognitive-browser"
Repository = "https://github.com/mikita12/cognitive-browser"
Issues = "https://github.com/mikita12/cognitive-browser/issues"

[project.scripts]
cognitive-browser = "cognitive_browser.mcp_server:main"
cognitive-browser-api = "cognitive_browser.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cognitive_browser*"]
